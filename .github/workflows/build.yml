name: Build Windows Terminal Fork

on:
  workflow_dispatch:
  push:
    branches: [wincli/*]
    tags: ['v*']
  pull_request:
    branches: [wincli/main]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            **/packages
          key: nuget-${{ hashFiles('**/packages.config', '**/Directory.Packages.props') }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet
        run: |
          nuget restore OpenConsole.slnx
          nuget restore dep\nuget\packages.config

      - name: Build Release x64
        run: |
          msbuild OpenConsole.slnx `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /p:RestorePackages=false

      - name: Package artifacts
        run: |
          $outDir = "src\cascadia\WindowsTerminal\bin\x64\Release"
          Compress-Archive -Path "$outDir\*" -DestinationPath "WindowsTerminal-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsTerminal-x64
          path: WindowsTerminal-x64.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WindowsTerminal-x64.zip
