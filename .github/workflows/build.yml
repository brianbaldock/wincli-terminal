name: Build Windows Terminal Fork

on:
  workflow_dispatch:
  push:
    branches: [wincli/*]
    tags: ['v*']
  pull_request:
    branches: [wincli/main]

jobs:
  build:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Windows 11 SDK (10.0.22621.0)
        shell: pwsh
        run: |
          $sdkPath = "C:\Program Files (x86)\Windows Kits\10\Include\10.0.22621.0"
          if (Test-Path $sdkPath) {
            Write-Host "SDK 10.0.22621.0 already installed"
            return
          }
          Write-Host "Downloading Windows 11 SDK 10.0.22621..."
          $installer = "$env:TEMP\winsdksetup.exe"
          Invoke-WebRequest -Uri "https://go.microsoft.com/fwlink/?linkid=2196241" -OutFile $installer
          Write-Host "Installing SDK (this takes a few minutes)..."
          Start-Process -FilePath $installer -ArgumentList "/features OptionId.DesktopCPPx64 /quiet /norestart /log $env:TEMP\sdk-install.log" -Wait -NoNewWindow
          if (!(Test-Path $sdkPath)) {
            Get-Content "$env:TEMP\sdk-install.log" -Tail 20 -ErrorAction SilentlyContinue
            throw "SDK installation failed - path not found after install"
          }
          Write-Host "SDK 10.0.22621.0 installed successfully"

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Cache NuGet packages
        uses: actions/cache@v4
        with:
          path: |
            ~/.nuget/packages
            **/packages
          key: nuget-${{ hashFiles('**/packages.config', '**/Directory.Packages.props') }}

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Restore NuGet
        run: |
          nuget restore OpenConsole.slnx
          nuget restore dep\nuget\packages.config

      - name: Build Release x64
        run: |
          msbuild OpenConsole.slnx `
            /p:Configuration=Release `
            /p:Platform=x64 `
            /m `
            /p:RestorePackages=false `
            /t:Terminal\WindowsTerminal

      - name: Package artifacts
        run: |
          $outDir = "src\cascadia\WindowsTerminal\bin\x64\Release"
          Compress-Archive -Path "$outDir\*" -DestinationPath "WindowsTerminal-x64.zip"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: WindowsTerminal-x64
          path: WindowsTerminal-x64.zip

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: WindowsTerminal-x64.zip
